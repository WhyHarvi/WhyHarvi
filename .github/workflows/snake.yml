name: profile art

# Builds the snake + the activity card and publishes both to the `output`
# branch, which README.md reads from. Self-hosted: no third-party card servers.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#3dffa2&color_dots=#11161d,#0b3d2a,#11704a,#1fb371,#3dffa2
            dist/snake-light.svg?palette=github-light&color_snake=#0a7f4f&color_dots=#ebedf0,#b6efd3,#6fd9a8,#21b373,#0a7f4f
            dist/snake.svg?palette=github-dark&color_snake=#3dffa2&color_dots=#11161d,#0b3d2a,#11704a,#1fb371,#3dffa2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: activity card
        run: node .github/scripts/stats.mjs dist/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
