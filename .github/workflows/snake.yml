name: profile art

# Builds the snake + the activity card and publishes both to the `output`
# branch, which README.md reads from. Self-hosted: no third-party card servers.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: activity card + snake game
        run: |
          node .github/scripts/stats.mjs dist/stats.svg
          node .github/scripts/snake.mjs dist/snake.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
          # New seed every run -> the four games play out differently each rebuild.
          SNAKE_SEED: ${{ github.run_id }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
